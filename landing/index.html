<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amora Florals — Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #4a3538;
      --rose: #c97b85;
      --muted: #9a7a82;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: Inter, system-ui, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #fbf6f3 0%, #f5e6e4 55%, #efd6d4 100%);
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
    }
    .story {
      width: min(420px, 100%);
      text-align: center;
    }
    .mark {
      width: 52px;
      height: 52px;
      margin: 0 auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, #e8979e, #c97b85 55%, #c47a5a);
      box-shadow: 0 10px 24px rgba(201, 123, 133, 0.28);
      font-size: 22px;
    }
    h1 {
      font-family: "Playfair Display", serif;
      font-weight: 500;
      font-size: clamp(52px, 10vw, 70px);
      line-height: 0.92;
      color: var(--rose);
      margin: 8px 0 0;
    }
    .florals {
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-size: 22px;
      margin-top: 2px;
    }
    .role {
      margin: 4px 0 16px;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 700;
      color: #9a7f82;
    }
    .card {
      background: rgba(255, 248, 250, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 18px;
      box-shadow: 0 2px 8px rgba(192, 96, 112, 0.08);
      padding: 6px 16px;
      text-align: left;
    }
    .point {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 10px 0;
    }
    .point .icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      flex: none;
      display: grid;
      place-items: center;
      background: #f5e6e4;
      color: var(--rose);
      font-size: 15px;
    }
    .point strong { display: block; font-size: 15px; line-height: 1.2; }
    .point span { display: block; color: var(--muted); font-size: 13px; line-height: 1.3; margin-top: 2px; }
    a.signin {
      height: 48px;
      margin-top: 14px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      background: linear-gradient(135deg, #d07080, #9a4858);
      box-shadow: 0 4px 16px rgba(192, 96, 112, 0.35);
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="story">
      <div class="mark" aria-hidden="true">✿</div>
      <h1>Amora</h1>
      <div class="florals">Florals</div>
      <p class="role">Admin</p>
      <div class="card">
        <article class="point">
          <div class="icon">✿</div>
          <div>
            <strong>Orders</strong>
            <span>Customers choose a bouquet and a delivery slot.</span>
          </div>
        </article>
        <article class="point">
          <div class="icon">▦</div>
          <div>
            <strong>Stock</strong>
            <span>The counter watches what is ready to sell.</span>
          </div>
        </article>
        <article class="point">
          <div class="icon">✉</div>
          <div>
            <strong>Messages</strong>
            <span>Replies stay in one thread with the shop.</span>
          </div>
        </article>
      </div>
      <a class="signin" href="/admin/login">Sign in</a>
    </section>
  </main>
</body>
</html>
